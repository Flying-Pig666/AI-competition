# Minimal event-focused imagery workflow; no full-scene duplicates are retained.
name: Fetch minimal Jilong remote sensing

on:
  push:
    branches:
      - chatgpt-data-fetch-20261025
    paths:
      - tools/fetch_jilong_remote_sensing_minimal.py
      - .github/workflows/chatgpt_fetch_jilong_remote_sensing_minimal.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-remote-sensing:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-data-fetch-20261025
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pystac-client planetary-computer rasterio shapely pyproj
      - name: Download and crop minimal imagery
        env:
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif,.TIF,.tiff,.TIFF
          VSI_CACHE: TRUE
          VSI_CACHE_SIZE: '50000000'
        run: python tools/fetch_jilong_remote_sensing_minimal.py
      - name: Upload only final datasets
        uses: actions/upload-artifact@v4
        with:
          name: jilong-remote-sensing-minimal-20261028
          path: remote_sensing_minimal/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
